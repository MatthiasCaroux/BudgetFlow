server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Même rôle que le proxy de vite.config.js en développement :
    # le navigateur appelle /api sur la même origine, nginx transmet au conteneur backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # React Router : toute URL inconnue renvoie index.html, le routage se fait côté navigateur
    location / {
        try_files $uri $uri/ /index.html;
    }
}
